<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live QR Scanner</title>
    <!-- Memuat pustaka QR Code Scanner resmi -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #result { margin-top: 20px; font-weight: bold; color: green; font-size: 1.2em; }
        .loading { color: orange; }
    </style>
</head>
<body>

    <h2>Live QR Code Scanner</h2>
    <div id="reader"></div>
    <div id="result"></div>

    <script>
        // GANTI INI dengan URL Web App dari Google Apps Script Anda
        const gasWebAppUrl = "https://script.google.com/macros/s/AKfycbyYgVyIxZgmQilaiHeLcwDduQn_ITRLqjoYaPj35CiS4YTXHQBMcyQ45-FAo_WwE5mqzw/exec"; 

        function onScanSuccess(decodedText, decodedResult) {
            // Hentikan sementara scanner agar tidak mengirim data berkali-kali
            html5QrcodeScanner.clear();
            
            document.getElementById('result').innerHTML = `<span class="loading">Mengirim data: ${decodedText}...</span>`;

            // Mengirim hasil scan ke Google Apps Script via POST
            fetch(gasWebAppUrl, {
                method: "POST",
                mode: "no-cors", // Mengatasi masalah kebijakan CORS eksternal
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ qrData: decodedText })
            })
            .then(() => {
                document.getElementById('result').innerText = `Sukses Tersimpan: ${decodedText}`;
                // Jalankan kembali scanner setelah jeda 3 detik jika ingin memindai lagi
                setTimeout(startScanner, 3000);
            })
            .catch(err => {
                document.getElementById('result').innerHTML = `<span style="color:red">Gagal menyimpan: ${err}</span>`;
            });
        }

        function startScanner() {
            document.getElementById('result').innerText = "Mencari QR Code...";
            html5QrcodeScanner.render(onScanSuccess);
        }

        // Inisialisasi konfigurasi scanner kamera belakang
        const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            rememberLastUsedCamera: true
        });
        
        startScanner();
    </script>
</body>
</html>
