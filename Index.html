<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi QR</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QRCode Library untuk scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Library QRCode.js untuk membuat QR Code pengguna -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0fdf4; /* Light green background */
        }
        /* Custom styling for scanner to override default lib styles */
        #reader {
            border: none !important;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background: white;
        }
        #reader video {
            border-radius: 1rem;
            object-fit: cover;
        }
        #reader__dashboard_section_csr button {
            background-color: #16a34a !important; /* Green-600 */
            color: white !important;
            padding: 8px 16px !important;
            border-radius: 9999px !important;
            border: none !important;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        #reader__dashboard_section_csr button:hover {
            background-color: #15803d !important; /* Green-700 */
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-content { display: none; }
        .tab-content.active.grid-view { display: grid; }
        .tab-content.active.flex-view { display: flex; }
        
        .modal { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
        .modal.active { display: flex; opacity: 1; }
        
        /* Custom Scrollbar untuk tabel */
        .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #bbf7d0; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #86efac; }
    </style>
</head>
<body class="min-h-screen text-gray-800 antialiased flex flex-col bg-[#f0fdf4]">

    <header class="bg-gradient-to-r from-green-600 to-emerald-500 shadow-lg">
        <div class="max-w-5xl mx-auto px-4 py-5 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-white p-2 rounded-lg shadow-sm">
                        <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white tracking-tight leading-none">Portal Absensi</h1>
                        <div class="text-green-100 text-xs mt-1" id="current-date"></div>
                    </div>
                </div>
                
                <!-- Navigasi Tabs -->
                <nav class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                    <button onclick="switchTab('scanner')" id="nav-scanner" class="nav-btn px-4 py-2 rounded-lg bg-white/20 text-white font-medium text-sm transition border border-white/30 whitespace-nowrap">Scanner QR</button>
                    <button onclick="switchTab('users')" id="nav-users" class="nav-btn px-4 py-2 rounded-lg bg-transparent text-green-50 font-medium text-sm hover:bg-white/10 transition border border-transparent whitespace-nowrap">Data User</button>
                    <button onclick="switchTab('attendance')" id="nav-attendance" class="nav-btn px-4 py-2 rounded-lg bg-transparent text-green-50 font-medium text-sm hover:bg-white/10 transition border border-transparent whitespace-nowrap">Riwayat Hadir</button>
                </nav>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8 sm:px-6 lg:px-8">
        
        <!-- VIEW 1: Scanner QR (Existing) -->
        <div id="view-scanner" class="tab-content grid-view active grid-cols-1 md:grid-cols-2 gap-8 animate-fade-in">
            <!-- Scanner Section -->
            <div class="flex flex-col gap-4">
                <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-6">
                    <h2 class="text-lg font-semibold text-green-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Scan QR Code
                    </h2>
                    <div id="reader" class="w-full"></div>
                    <p class="text-sm text-gray-500 mt-4 text-center">Arahkan QR code pengguna ke kamera untuk mencatat kehadiran.</p>
                </div>
            </div>

            <!-- Result Section -->
            <div class="flex flex-col gap-4">
                <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-6 h-full flex flex-col">
                    <h2 class="text-lg font-semibold text-green-800 mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Status Kehadiran
                    </h2>
                    
                    <div id="status-container" class="flex-grow flex flex-col items-center justify-center text-center p-4 bg-green-50/50 rounded-xl border border-dashed border-green-200">
                        <svg class="w-16 h-16 text-green-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="text-gray-400">Menunggu scan QR code...</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-users" class="tab-content flex-view flex-col gap-6 animate-fade-in w-full">
            <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-6 w-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-semibold text-green-800 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        Daftar Pengguna Terdaftar
                    </h2>
                    <button onclick="loadUsers()" class="text-green-600 hover:text-green-800 p-2 bg-green-50 rounded-lg transition" title="Refresh Data">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                
                <div class="table-container overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-green-50">
                                <th class="p-3 text-sm font-semibold text-green-800 rounded-tl-lg">ID</th>
                                <th class="p-3 text-sm font-semibold text-green-800">Nama</th>
                                <th class="p-3 text-sm font-semibold text-green-800">Fakultas</th>
                                <th class="p-3 text-sm font-semibold text-green-800 text-center rounded-tr-lg w-24">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <!-- Data dimuat melalui JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-attendance" class="tab-content flex-view flex-col gap-6 animate-fade-in w-full">
            <div class="bg-white rounded-2xl shadow-sm border border-green-100 p-6 w-full">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-semibold text-green-800 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                        Riwayat Absensi
                    </h2>
                    <button onclick="loadAttendance()" class="text-green-600 hover:text-green-800 p-2 bg-green-50 rounded-lg transition" title="Refresh Data">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
                
                <div class="table-container overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-green-50">
                                <th class="p-3 text-sm font-semibold text-green-800 rounded-tl-lg">Waktu</th>
                                <th class="p-3 text-sm font-semibold text-green-800">ID</th>
                                <th class="p-3 text-sm font-semibold text-green-800">Nama</th>
                                <th class="p-3 text-sm font-semibold text-green-800 rounded-tr-lg">Fakultas</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-tbody">
                            <!-- Data dimuat melalui JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div id="qr-modal" class="modal fixed inset-0 z-50 items-center justify-center p-4 bg-gray-900/40 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 animate-fade-in relative border border-green-100">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="text-center">
                <h3 class="text-lg font-bold text-green-800 mb-1" id="modal-name">Nama User</h3>
                <p class="text-sm text-gray-500 mb-6 font-mono bg-gray-50 py-1 px-2 rounded inline-block" id="modal-id">ID: 000</p>
                
                <div class="flex justify-center p-4 bg-white border-2 border-dashed border-green-200 rounded-xl mb-6">
                    <div id="qrcode-canvas"></div>
                </div>
                
                <button onclick="closeModal()" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white font-medium rounded-xl transition">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Inisialisasi Tanggal ---
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('id-ID', dateOptions);

        // --- Logika Scanner QR ---
        let html5QrcodeScanner;
        let isProcessing = false;
        let qrcodeLib = null; 
        
        document.addEventListener('DOMContentLoaded', () => {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 }, false);
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);

            // Init QRCode js
            qrcodeLib = new QRCode(document.getElementById("qrcode-canvas"), {
                width: 200, height: 200, colorDark : "#166534", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H
            });
        });

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return;
            isProcessing = true;
            showLoading();

            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(handleServerResponse).withFailureHandler(handleServerError).recordAttendance(decodedText);
            } else {
                // Mock untuk Preview Mode
                setTimeout(() => {
                    handleServerResponse({ success: true, id: decodedText, name: "Budi Santoso (Demo)", faculty: "Teknik Informatika", time: new Date().toLocaleTimeString('id-ID') });
                }, 1000);
            }
        }
        function onScanFailure(error) { /* ignored */ }

        function handleServerResponse(response) {
            const container = document.getElementById('status-container');
            container.innerHTML = '';
            container.className = "flex-grow flex flex-col items-center justify-center p-6 rounded-xl animate-fade-in text-center " + 
                                  (response.success ? "bg-green-100 border border-green-300" : "bg-red-50 border border-red-200");

            if (response.success) {
                container.innerHTML = `
                    <div class="bg-green-500 rounded-full p-2 mb-4 shadow-sm"><svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></div>
                    <h3 class="text-xl font-bold text-green-800 mb-1">Berhasil Disimpan!</h3>
                    <p class="text-green-600 text-sm mb-4 font-medium">${response.time}</p>
                    <div class="w-full bg-white rounded-lg p-4 shadow-sm text-left border border-green-100">
                        <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-gray-500 col-span-1">ID</span><span class="text-gray-800 font-semibold col-span-2">${response.id}</span></div>
                        <div class="grid grid-cols-3 gap-2 text-sm mb-2"><span class="text-gray-500 col-span-1">Nama</span><span class="text-gray-800 font-semibold col-span-2">${response.name}</span></div>
                        <div class="grid grid-cols-3 gap-2 text-sm"><span class="text-gray-500 col-span-1">Fakultas</span><span class="text-gray-800 font-semibold col-span-2">${response.faculty}</span></div>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="bg-red-500 rounded-full p-2 mb-4 shadow-sm"><svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></div>
                    <h3 class="text-xl font-bold text-red-800 mb-2">Gagal Tersimpan</h3>
                    <p class="text-red-600 text-sm">${response.message}</p>`;
            }
            setTimeout(() => { isProcessing = false; resetUI(); }, 3500);
        }

        function handleServerError(error) { handleServerResponse({ success: false, message: "Server error: " + error.message }); }
        
        function showLoading() {
            const container = document.getElementById('status-container');
            container.className = "flex-grow flex flex-col items-center justify-center p-6 bg-white rounded-xl border border-green-100 text-center";
            container.innerHTML = `<div class="w-12 h-12 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-4"></div><p class="text-green-700 font-medium">Memproses data...</p>`;
        }

        function resetUI() {
            const container = document.getElementById('status-container');
            container.className = "flex-grow flex flex-col items-center justify-center text-center p-4 bg-green-50/50 rounded-xl border border-dashed border-green-200 animate-fade-in";
            container.innerHTML = `<svg class="w-16 h-16 text-green-200 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg><p class="text-gray-400">Menunggu scan QR code...</p>`;
        }

        // --- Logika Navigasi Tab ---
        function switchTab(tabId) {
            // Sembunyikan semua tab
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            
            // Reset navigasi
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-white/20', 'text-white', 'border-white/30');
                btn.classList.add('bg-transparent', 'text-green-50', 'border-transparent');
            });

            // Tampilkan tab yang dipilih
            document.getElementById('view-' + tabId).classList.add('active');
            
            // Aktifkan tombol nav
            const activeBtn = document.getElementById('nav-' + tabId);
            activeBtn.classList.remove('bg-transparent', 'text-green-50', 'border-transparent');
            activeBtn.classList.add('bg-white/20', 'text-white', 'border-white/30');

            // Load data jika perlu
            if(tabId === 'users') loadUsers();
            if(tabId === 'attendance') loadAttendance();
        }

        // --- Logika Fetch & Render Data ---
        function showTableLoading(tbodyId) {
            document.getElementById(tbodyId).innerHTML = `<tr><td colspan="4" class="p-8 text-center"><div class="inline-block w-8 h-8 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-2"></div><p class="text-green-700 text-sm">Memuat data...</p></td></tr>`;
        }

        function loadUsers() {
            showTableLoading('users-tbody');
            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(renderUsers).withFailureHandler(err => renderTableError('users-tbody', err)).getUsersData();
            } else {
                // Mock Mode
                setTimeout(() => {
                    renderUsers({ success: true, data: [
                        {id: "TI1001", name: "Budi Santoso", faculty: "Teknik Informatika"},
                        {id: "EK2003", name: "Siti Aminah", faculty: "Ekonomi"},
                        {id: "HK3021", name: "Andi Wijaya", faculty: "Hukum"}
                    ]});
                }, 800);
            }
        }

        function renderUsers(response) {
            const tbody = document.getElementById('users-tbody');
            if (!response.success) return renderTableError('users-tbody', response.message);
            if (response.data.length === 0) return tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">Belum ada data pengguna.</td></tr>`;
            
            tbody.innerHTML = response.data.map((user, idx) => `
                <tr class="border-b border-gray-100 hover:bg-green-50/50 transition">
                    <td class="p-3 text-sm font-medium text-gray-700">${user.id}</td>
                    <td class="p-3 text-sm text-gray-600">${user.name}</td>
                    <td class="p-3 text-sm text-gray-600">${user.faculty}</td>
                    <td class="p-3 text-center">
                        <button onclick="openModal('${user.id}', '${user.name}')" class="px-3 py-1.5 bg-green-100 text-green-700 hover:bg-green-200 hover:text-green-800 rounded-lg text-xs font-semibold transition">Lihat QR</button>
                    </td>
                </tr>
            `).join('');
        }

        function loadAttendance() {
            showTableLoading('attendance-tbody');
            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(renderAttendance).withFailureHandler(err => renderTableError('attendance-tbody', err)).getAttendanceData();
            } else {
                // Mock Mode
                setTimeout(() => {
                    renderAttendance({ success: true, data: [
                        {time: "19/08/2026 08:15:00", id: "TI1001", name: "Budi Santoso", faculty: "Teknik Informatika"},
                        {time: "19/08/2026 08:12:30", id: "EK2003", name: "Siti Aminah", faculty: "Ekonomi"}
                    ]});
                }, 800);
            }
        }

        function renderAttendance(response) {
            const tbody = document.getElementById('attendance-tbody');
            if (!response.success) return renderTableError('attendance-tbody', response.message);
            if (response.data.length === 0) return tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">Belum ada data absensi.</td></tr>`;
            
            tbody.innerHTML = response.data.map(log => `
                <tr class="border-b border-gray-100 hover:bg-green-50/50 transition">
                    <td class="p-3 text-sm font-medium text-gray-700">${log.time}</td>
                    <td class="p-3 text-sm text-gray-600">${log.id}</td>
                    <td class="p-3 text-sm text-gray-600">${log.name}</td>
                    <td class="p-3 text-sm text-gray-600">${log.faculty}</td>
                </tr>
            `).join('');
        }

        function renderTableError(tbodyId, error) {
            document.getElementById(tbodyId).innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500 text-sm">Gagal memuat data: ${error}</td></tr>`;
        }

        // --- Logika Modal QR Code ---
        function openModal(id, name) {
            document.getElementById('modal-name').textContent = name;
            document.getElementById('modal-id').textContent = `ID: ${id}`;
            qrcodeLib.clear();
            qrcodeLib.makeCode(id); // Generate QR berdasarkan ID
            document.getElementById('qr-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('qr-modal').classList.remove('active');
        }
    </script>
</body>
</html>
